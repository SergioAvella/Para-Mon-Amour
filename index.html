<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para ti, mi amor ❤️</title>
  <style>
    /* ============================================================
       RESET Y VARIABLES GLOBALES
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #120d12;                 /* Fondo oscuro cálido */
      --card: #201722;               /* Fondo de la polaroid */
      --soft: #fff5f6;               /* Texto principal (crema rosado) */
      --soft-dim: rgba(255, 235, 240, 0.6);
      --accent: #ff4d6d;             /* Rojo romántico */
      --accent-2: #ffb3c1;           /* Rosa claro */
      --glow: rgba(255, 77, 109, 0.4);
      --trazo: rgba(255, 255, 255, 0.1);
    }

    body {
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(circle at 50% 18%, #241620 0%, #161019 45%, var(--bg) 75%);
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;               /* sin scroll horizontal */
      overflow-y: auto;                 /* si el contenido no cabe, se baja */
      color: var(--soft);
    }

    /* ============================================================
       CORAZONES Y LUCES (PARTÍCULAS) FLOTANTES DE FONDO
       ============================================================ */
    #hearts {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .heart {
      position: absolute;
      bottom: -70px;
      font-size: 22px;
      color: var(--accent);
      opacity: 0;
      animation-name: floatUp;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      filter: drop-shadow(0 0 10px var(--glow));
      will-change: transform, opacity;
    }

    /* Los corazones suben desde abajo, con leve balanceo y giro */
    @keyframes floatUp {
      0%   { transform: translateY(0) translateX(0) rotate(0deg);       opacity: 0; }
      12%  { opacity: var(--h-op, 0.6); }
      80%  { opacity: var(--h-op, 0.4); }
      100% { transform: translateY(-115vh) translateX(var(--h-drift, 40px))
                    rotate(var(--h-spin, 25deg));                     opacity: 0; }
    }

    /* Destellos / chispitas de luz que titilan */
    .sparkle {
      position: absolute;
      top: 0;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 10px 3px rgba(255, 179, 193, 0.55);
      opacity: 0;
      animation: twinkle var(--sp-dur, 4s) ease-in-out infinite;
      animation-delay: var(--sp-delay, 0s);
      will-change: opacity, transform;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0;    transform: scale(0.5); }
      50%      { opacity: var(--sp-op, 0.7); transform: scale(1.15); }
    }

    /* ============================================================
       BOTÓN INICIAL "PRESIONAR PARA EMPEZAR"
       ============================================================ */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: rgba(18, 12, 16, 0.88);
      backdrop-filter: blur(8px);
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    #overlay p {
      font-family: "Segoe Script", "Brush Script MT", cursive;
      font-size: 1.5rem;
      letter-spacing: 1px;
      color: var(--soft-dim);
      animation: pulseText 2.5s ease-in-out infinite;
    }

    #overlay p.sub {
      font-size: 0.95rem;
      letter-spacing: 2px;
      color: rgba(255, 179, 193, 0.75);
    }

    @keyframes pulseText {
      0%, 100% { opacity: 0.6; }
      50%      { opacity: 1; }
    }

    #start-btn {
      border: 2px solid var(--accent);
      background: linear-gradient(135deg, rgba(255, 77, 109, 0.14), rgba(255, 179, 193, 0.06));
      color: var(--soft);
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 16px 42px;
      border-radius: 60px;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
      animation: heartBeat 1.8s ease-in-out infinite;
    }

    /* Latido de corazón del botón para invitarlo a presionar */
    @keyframes heartBeat {
      0%, 100% { transform: scale(1);    box-shadow: 0 0 18px rgba(255, 77, 109, 0.25); }
      15%      { transform: scale(1.05); box-shadow: 0 0 34px var(--glow); }
      30%      { transform: scale(1); }
      45%      { transform: scale(1.04); box-shadow: 0 0 30px var(--glow); }
    }

    /* Pulso luminoso del botón al pasar el mouse */
    #start-btn:hover {
      transform: scale(1.08);
      animation-play-state: paused;
      background: rgba(255, 77, 109, 0.2);
      box-shadow: 0 0 40px var(--glow), 0 0 80px rgba(255, 77, 109, 0.2);
    }

    /* ============================================================
       POLAROID CENTRAL
       ============================================================ */
    .stage {
      position: relative;
      z-index: 5;
      /* Columna centrada: con margin:auto, si el contenido es más alto que
         la pantalla el navegador hace scroll y nada queda cortado arriba.
         min-height: ocupa toda la altura disponible en cualquier pantalla */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto;
      width: 100%;
      max-width: 92vw;
      min-height: 100vh;
      min-height: 100svh;
      padding: 16px 0;
      text-align: center;
    }

    .polaroid {
      position: relative;
      /* Ancho adaptable: máximo 340px, pero nunca más ancho que la pantalla */
      width: min(340px, 88vw);
      max-width: 100%;
      flex: 0 0 auto;
      margin: 0 auto;                /* centrado horizontal garantizado */
      background: linear-gradient(160deg, #2a1e2b 0%, var(--card) 60%);
      border: 1px solid rgba(255, 179, 193, 0.18);
      border-radius: 22px;
      padding: 18px 18px 10px;
      animation: glowPulse 5s ease-in-out infinite;
      transition: transform 0.4s ease;
    }

    /* Halo que respira, como una vela encendida */
    @keyframes glowPulse {
      0%, 100% {
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55), 0 0 55px rgba(255, 77, 109, 0.22);
      }
      50% {
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55), 0 0 95px rgba(255, 77, 109, 0.45);
      }
    }

    /* Cinta adhesiva decorativa arriba de la polaroid */
    .polaroid::before {
      content: "";
      position: absolute;
      top: -12px;
      left: 50%;
      width: 96px;
      height: 26px;
      transform: translateX(-50%) rotate(-2deg);
      background: linear-gradient(180deg, rgba(255, 179, 193, 0.55), rgba(255, 179, 193, 0.28));
      border-radius: 3px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      pointer-events: none;
    }

    /* Ligera inclinación y levitación del marco */
    .polaroid:hover {
      transform: rotate(0deg) translateY(-4px);
    }

    .polaroid.skew {
      transform: rotate(-1.5deg);
    }

    /* Recuadro de la foto con esquinas redondeadas y borde blanco.
       aspect-ratio: la foto crece y encoge con el ancho sin deformarse */
    .photo-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      height: auto;
      border-radius: 14px;
      overflow: hidden;
      background: #0c0810;
      border: 3px solid rgba(255, 245, 246, 0.9);
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5), 0 6px 18px rgba(0, 0, 0, 0.45);
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;                            /* arranca invisible */
      transition: opacity 0.6s ease;
      transform: scale(1.05);
    }

    /* Clase que hace visible la foto (fade-in suave) */
    .photo-frame img.show {
      opacity: 1;
      transform: scale(1);
    }

    /* Contador de fotos estilo romántico */
    .caption {
      font-family: "Segoe Script", "Brush Script MT", cursive;
      padding: 12px 6px 8px;
      font-size: 1rem;
      letter-spacing: 1px;
      color: var(--soft-dim);
    }

    .caption .count {
      color: var(--accent);
      font-weight: 700;
    }

    /* ============================================================
       LETRA SINCRONIZADA CON EFECTO KARAOKE (iluminación progresiva)
       ============================================================ */
    #lyric {
      /* Altura estable que se ajusta a la pantalla y centro fijo:
         al cambiar de línea la foto NO se mueve */
      width: min(660px, 92vw);
      height: clamp(116px, 17vh, 138px);
      margin: 18px auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 16px;
      overflow: hidden;
      text-align: center;
      font-family: "Segoe Script", "Brush Script MT", Georgia, cursive;
      font-size: clamp(1.05rem, 2.3vw, 1.55rem);
      font-weight: 600;
      line-height: 1.5;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    #lyric.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* La frase que se va iluminando de izquierda a derecha.
       --p (0 → 1) lo actualiza el JS en cada frame según el audio. */
    .lyric-line {
      --p: 0;
      display: inline-block;
      max-width: 100%;
      background-image: linear-gradient(
        90deg,
        #ffffff 0%,
        #ffd1dc 24%,
        #ff4d6d 46%,
        rgba(255, 245, 246, 0.22) 54%,
        rgba(255, 245, 246, 0.22) 100%
      );
      background-size: 200% 100%;
      background-repeat: no-repeat;
      background-position: calc((1 - var(--p)) * 100%) 0;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(255, 77, 109, 0.55))
              drop-shadow(0 0 22px rgba(255, 77, 109, 0.28));
      will-change: background-position;
    }

    #lyric .heart-ico {
      display: inline-block;
      flex: 0 0 auto;
      color: var(--accent);
      -webkit-text-fill-color: var(--accent);
      filter: drop-shadow(0 0 10px var(--glow));
      animation: beat 1.4s ease-in-out infinite;
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      30%      { transform: scale(1.25); }
      45%      { transform: scale(1); }
    }

    /* Título de la pareja (arriba de la polaroid) */
    .couple-title {
      margin-bottom: 14px;
      text-align: center;
      font-family: "Segoe Script", "Brush Script MT", cursive;
      font-size: clamp(1.7rem, 5.4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--accent-2);
      text-shadow: 0 0 18px rgba(255, 77, 109, 0.6), 0 0 40px rgba(255, 77, 109, 0.35);
    }

    .couple-title span {
      font-weight: 400;
      font-size: 0.8em;
      color: var(--soft-dim);
      margin: 0 8px;
    }

    /* Título de la canción (encima de la barra de progreso) */
    .song-title {
      margin-top: 16px;
      text-align: center;
      font-family: "Segoe Script", "Brush Script MT", cursive;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--accent-2);
      text-shadow: 0 0 14px rgba(255, 77, 109, 0.55), 0 0 30px rgba(255, 77, 109, 0.3);
    }

    .song-title span {
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--soft-dim);
    }

    /* Barra de progreso de la canción */
    .timeline {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: center;
      font-size: 0.8rem;
      color: var(--soft-dim);
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    /* Barra arrastrable para mover la canción a cualquier minuto */
    .timeline .bar {
      position: relative;
      width: min(240px, 46vw);
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      cursor: pointer;
      overflow: visible;
      touch-action: none;                 /* permite arrastrar en móvil */
    }

    /* Zona de clic un poco más alta, sin cambiar el grosor visual */
    .timeline .bar::before {
      content: "";
      position: absolute;
      inset: -12px -6px;
    }

    .timeline .bar:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .timeline .bar i {
      position: relative;
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #ffb3c1);
      border-radius: 999px;
      box-shadow: 0 0 10px var(--glow);
      transition: width 0.2s linear;
    }

    /* Bolita que marca la posición actual */
    .timeline .bar i::after {
      content: "";
      position: absolute;
      top: 50%;
      right: -6px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff5f6;
      box-shadow: 0 0 12px var(--glow), 0 0 4px rgba(255, 255, 255, 0.8);
      transform: translateY(-50%) scale(0.85);
      transition: transform 0.15s ease;
    }

    .timeline .bar:hover i::after { transform: translateY(-50%) scale(1.1); }

    /* Botón de pausa / reanudar (pausa canción y fotos) */
    #pause-btn {
      margin-top: 16px;
      border: 1px solid rgba(255, 179, 193, 0.4);
      background: rgba(255, 77, 109, 0.1);
      color: var(--soft);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 9px 24px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    #pause-btn:hover {
      background: rgba(255, 77, 109, 0.22);
      box-shadow: 0 0 22px var(--glow);
      transform: scale(1.05);
    }

    #pause-btn:active {
      transform: scale(0.97);
    }

    /* Botón para abrir la galería de fotos */
    #galeria-btn {
      margin-top: 10px;
      border: 1px solid rgba(255, 179, 193, 0.45);
      background: linear-gradient(135deg, rgba(255, 77, 109, 0.16), rgba(255, 179, 193, 0.05));
      color: var(--soft);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 9px 22px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    #galeria-btn:hover {
      background: rgba(255, 77, 109, 0.24);
      box-shadow: 0 0 24px var(--glow);
      transform: scale(1.05);
    }

    /* ============================================================
       GALERÍA: TODAS LAS FOTOS EN UNA CUADRÍCULA
       ============================================================ */
    #galeria {
      position: fixed;
      inset: 0;
      z-index: 40;
      background:
        radial-gradient(circle at 25% 15%, rgba(255, 77, 109, 0.16), transparent 46%),
        radial-gradient(circle at 75% 85%, rgba(255, 179, 193, 0.13), transparent 46%),
        rgba(16, 10, 14, 0.96);
      backdrop-filter: blur(6px);
      overflow-y: auto;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    #galeria.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* Cabecera fija de la galería */
    .g-head {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: linear-gradient(180deg, rgba(16, 10, 14, 0.95), rgba(16, 10, 14, 0.85));
      border-bottom: 1px solid rgba(255, 179, 193, 0.15);
    }

    .g-head h2 {
      font-family: "Segoe Script", "Brush Script MT", cursive;
      font-size: 1.3rem;
      color: var(--accent-2);
      text-shadow: 0 0 14px rgba(255, 77, 109, 0.5);
      letter-spacing: 1px;
    }

    .g-head .g-sub {
      display: block;
      font-family: "Segoe Script", "Brush Script MT", cursive;
      font-size: 0.78rem;
      font-weight: normal;
      color: rgba(255, 179, 193, 0.85);
      text-shadow: 0 0 10px rgba(255, 77, 109, 0.4);
      letter-spacing: 1.5px;
      margin-top: 3px;
    }

    #galeria-cierre {
      border: 1px solid rgba(255, 179, 193, 0.4);
      background: rgba(255, 77, 109, 0.12);
      color: var(--soft);
      font-size: 1.1rem;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    #galeria-cierre:hover {
      background: rgba(255, 77, 109, 0.28);
      box-shadow: 0 0 18px var(--glow);
      transform: scale(1.1) rotate(90deg);
    }

    /* Cuadrícula de mini-polaroids */
    .g-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
      gap: 18px;
      width: min(920px, 100%);
      margin: 0 auto;
      padding: 88px 20px 50px;
    }

    /* Cada foto: marco tipo polaroid + cinta + rotación casera */
    .g-item {
      margin: 0;
      opacity: 1;
      cursor: pointer;
    }

    .g-animar .g-item {
      animation: gEntrada 0.55s ease both;
      animation-delay: calc(var(--i) * 55ms);
    }

    .g-marco {
      position: relative;
      background: linear-gradient(165deg, #fff9f5, #ffe3ea);
      padding: 7px 7px 5px;
      border-radius: 6px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
      transform: rotate(var(--g-rot));
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* Cinta adhesiva en la esquina */
    .g-marco::before {
      content: "";
      position: absolute;
      top: -12px;
      left: 50%;
      width: 44px;
      height: 16px;
      transform: translateX(-50%) rotate(-6deg);
      background: rgba(255, 179, 193, 0.35);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      z-index: 1;
    }

    .g-marco img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 4px;
      display: block;
    }

    .g-item:hover .g-marco {
      transform: rotate(0deg) scale(1.07);
      box-shadow: 0 0 30px var(--glow), 0 14px 30px rgba(0, 0, 0, 0.55);
    }

    .g-item figcaption {
      text-align: center;
      font-family: "Segoe Script", "Brush Script MT", cursive;
      font-size: 0.85rem;
      color: #ff8ba0;
      padding: 7px 4px 2px;
      text-shadow: 0 0 10px rgba(255, 77, 109, 0.55);
      letter-spacing: 1px;
    }

    /* Entrada suave y escalonada al abrir la galería */
    @keyframes gEntrada {
      from { opacity: 0; transform: translateY(16px) scale(0.94); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ============================================================
       FONDO DECORATIVO: "Mi amor" EN MUCHOS IDIOMAS
       Repartido por TODA la pantalla (visible en cualquier dispositivo).
       Las frases flotan suavemente; el JS las coloca con posición y
       tamaño aleatorios, siempre dentro del área visible.
       ============================================================ */
    #amor-bg {
      position: fixed;
      inset: 0;
      z-index: 1;                    /* detrás del escenario (z-5) */
      overflow: hidden;
      pointer-events: none;          /* nunca bloquea clics */
    }

    #amor-bg span {
      position: absolute;
      white-space: nowrap;
      font-family: "Segoe Script", "Brush Script MT", cursive;
      font-weight: 600;
      letter-spacing: 1px;
      color: #ffd9e2;
      text-shadow: 0 0 12px rgba(255, 77, 109, 0.6), 0 0 26px rgba(255, 77, 109, 0.3);
      /* Las frases cruzan la pantalla con un recorrido ONDULADO,
         como una serpiente. El JS fija duración, retardo, dirección,
         la amplitud (--amp) y la rotación. ease-in-out redondea las
         curvas para que no se vean rectas. */
      animation-name: serpiente;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      will-change: translate;
    }

    /* Recorrido serpenteante: sube y baja varias veces mientras cruza,
       como una "S" doble al deslizarse por la pantalla. */
    @keyframes serpiente {
      0%    { translate: -115vw calc(var(--amp, 60px) * 0); }
      6%    { translate: -98vw  calc(var(--amp, 60px) * 0.4); }
      12%   { translate: -86vw  calc(var(--amp, 60px) * 0.85); }
      18%   { translate: -72vw  calc(var(--amp, 60px) * 0.97); }
      24%   { translate: -58vw  calc(var(--amp, 60px) * 1); }
      30%   { translate: -44vw  calc(var(--amp, 60px) * 0.9); }
      36%   { translate: -29vw  calc(var(--amp, 60px) * 0.7); }
      42%   { translate: -15vw  calc(var(--amp, 60px) * 0.3); }
      48%   { translate: 0vw    calc(var(--amp, 60px) * 0.05); }
      54%   { translate: 15vw   calc(var(--amp, 60px) * -0.3); }
      60%   { translate: 29vw   calc(var(--amp, 60px) * -0.7); }
      66%   { translate: 44vw   calc(var(--amp, 60px) * -0.9); }
      72%   { translate: 58vw   calc(var(--amp, 60px) * -1); }
      78%   { translate: 72vw   calc(var(--amp, 60px) * -0.97); }
      84%   { translate: 86vw   calc(var(--amp, 60px) * -0.85); }
      90%   { translate: 98vw   calc(var(--amp, 60px) * -0.4); }
      100%  { translate: 115vw  calc(var(--amp, 60px) * 0); }
    }

    /* ============================================================
       RESPONSIVO
       ============================================================ */
    /* Móviles pequeños: todo se compacta pero nada se corta */
    @media (max-width: 480px) {
      .polaroid { width: min(340px, 92vw); padding: 14px 14px 8px; }
      .polaroid::before { width: 72px; height: 22px; }

  <script>

    /* ============================================================
       2. CORAZONES Y DESTELLOS FLOTANTES DE FONDO
       ============================================================ */
    const contenedor = document.getElementById("hearts");
    const EMOJIS = ["💗", "💖", "❤️", "💘", "💞", "💓", "🌹"];

    (function crearCorazones() {
      const cantidad = 30;                     // más amor de fondo

        s.style.setProperty("--sp-delay", (Math.random() * 6).toFixed(2) + "s");

    /* ============================================================
       2b. FONDO DECORATIVO: "Mi amor" EN MUCHOS IDIOMAS
       Repartido por toda la pantalla. Aprovecha FRASES_AMOR para
       colocarlas en posiciones al azar: se ven en cualquier
       dispositivo, incluso los celulares pequeños.
       ============================================================ */
    const FRASES_AMOR = [
      "Mi amor", "Mon amour", "My love", "Amore mio", "Meu amor",
      "Meine Liebe", "Mijn liefde", "Min älskling", "Moja miłość",
      "Моя любовь", "Αγάπη μου", "Aşkım", "私の愛", "내 사랑",
      "我的愛", "حبيبي", "אהבתי", "मेरा प्यार", "Amor meu",
      "Tesoro mío", "Mi vida", "Ma chérie", "My darling", "Mein Schatz"
    ];

    (function crearFondoAmor() {
      const fondo = document.getElementById("amor-bg");
      const esMovil = window.innerWidth < 700;
      const cantidad = esMovil ? 20 : 30;      // suficientes para cubrir la pantalla
      for (let i = 0; i < cantidad; i++) {
        const span = document.createElement("span");
        const frase = FRASES_AMOR[i % FRASES_AMOR.length] + " ♥";

        span.style.left = (1 + Math.random() * 71) + "vw";    // 1%..72%
        span.style.top  = (2 + Math.random() * 82) + "vh";    // 2%..84%
        span.style.fontSize = (0.72 + Math.random() * 0.6) * (esMovil ? 0.75 : 1) + "rem";
        span.style.opacity = (0.22 + Math.random() * 0.14).toFixed(2);
        span.style.animationDuration = (26 + Math.random() * 30).toFixed(1) + "s";
        span.style.animationDelay = (-Math.random() * 45).toFixed(1) + "s";
        span.style.animationDirection = Math.random() < 0.5 ? "normal" : "reverse";
        // Amplitud de la onda serpenteante (los picos de arriba/abajo)
        span.style.setProperty("--amp", (40 + Math.random() * 55).toFixed(0) + "px");
        span.style.transform =
          "rotate(" + (Math.random() * 10 - 5).toFixed(1) + "deg)";

    /* ============================================================
       3. CARRUSEL DE FOTOS CON FADE-IN / FADE-OUT
       ============================================================ */
    const imgFoto  = document.getElementById("photo");
    const numFoto  = document.getElementById("photoCount");
    const totFoto  = document.getElementById("photoTotal");
    let temporizador = null;        // guarda el intervalo del carrusel
    let colaFotos  = [];            // próximas fotos en orden aleatorio
    let contadorFoto = 0;           // cuál va saliendo (1ª, 2ª, 3ª…)

    totFoto.textContent = fotos.length;

    function cargarFoto(i) {
      imgFoto.src = fotos[i];
      imgFoto.onload = () => imgFoto.classList.add("show");   // fade-in
    }

    // Muestra la foto indicada con un fundido suave
    function mostrarFoto(i) {
      imgFoto.classList.remove("show");                        // fade-out
      setTimeout(() => cargarFoto(i), DURACION_FADE);          // nueva foto + fade-in
    }

    // Crea una permutación aleatoria de los índices de las fotos
    // (Fisher-Yates): cada vuelta recorre las fotos en un orden distinto.
    function barajarFotos() {
      colaFotos = [];
      for (let i = 0; i < fotos.length; i++) colaFotos.push(i);
      for (let i = colaFotos.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = colaFotos[i];
        colaFotos[i] = colaFotos[j];
        colaFotos[j] = tmp;
      }
    }

    // Arranca (o reinicia) el carrusel desde una foto elegida al azar.
    // Se llama al presionar el botón, para que las fotos empiecen junto
    // con la canción y no antes.
    function iniciarCarrusel() {
      barajarFotos();                                          // nuevo orden aleatorio
      const primera = colaFotos.shift() || 0;
      contadorFoto = 1;                                        // la 1ª que sale
      cargarFoto(primera);
      numFoto.textContent = contadorFoto;
      if (temporizador) clearInterval(temporizador);           // evita duplicados
      temporizador = setInterval(avanzarFoto, INTERVALO_FOTO);
    }

    // Pasa a la siguiente foto aleatoria (una sola vez)
    function avanzarFoto() {
      if (colaFotos.length === 0) barajarFotos();              // nueva vuelta aleatoria
      // El número cuenta el orden en que van apareciendo, sea cual sea la foto
      contadorFoto = (contadorFoto % fotos.length) + 1;        // 1,2,…,22,1,2…
      numFoto.textContent = contadorFoto;
      mostrarFoto(colaFotos.shift());
    }

    // Detiene el avance de las fotos (la que se ve se queda quieta)
    function pausarCarrusel() {
      if (temporizador) { clearInterval(temporizador); temporizador = null; }
    }

    // Reanuda el avance de las fotos
    function reanudarCarrusel() {
      if (!temporizador) temporizador = setInterval(avanzarFoto, INTERVALO_FOTO);
    }

    // Precarga todas las fotos para que el cambio sea instantáneo
    fotos.forEach((src) => { const im = new Image(); im.src = src; });

    /* ============================================================
       3b. GALERÍA: VER TODAS LAS FOTOS
       ============================================================ */
    const galeriaBtn  = document.getElementById("galeria-btn");
    const galeria     = document.getElementById("galeria");
    const galeriaGrid = document.getElementById("galeria-grid");

    // Construye la cuadrícula con las 22 fotos (mismo orden de la lista)
    // Cada una se muestra como un mini-polaroid con rotación casera.
    fotos.forEach((src, i) => {
      const item  = document.createElement("figure");
      item.className = "g-item";
      item.style.setProperty("--i", i);
      item.style.setProperty("--g-rot", (Math.random() * 4 - 2).toFixed(1) + "deg");

      const marco = document.createElement("div");
      marco.className = "g-marco";
      const im = document.createElement("img");
      im.src = src;
      im.alt = "Nuestra foto " + (i + 1);
      im.loading = "lazy";
      marco.appendChild(im);

      const cap = document.createElement("figcaption");
      cap.textContent = (i + 1) + " ❤";

      item.appendChild(marco);
      item.appendChild(cap);
      galeriaGrid.appendChild(item);
    });

    function abrirGaleria() {
      galeria.classList.add("open");
      galeria.setAttribute("aria-hidden", "false");
      // Reproduce la entrada escalonada de las fotos cada vez que se abre
      galeriaGrid.classList.remove("g-animar");
      void galeriaGrid.offsetWidth;                    // fuerza reflow
      galeriaGrid.classList.add("g-animar");
    }

    function cerrarGaleria() {
      galeria.classList.remove("open");
      galeria.setAttribute("aria-hidden", "true");
    }

    galeriaBtn.addEventListener("click", abrirGaleria);
    document.getElementById("galeria-cierre").addEventListener("click", cerrarGaleria);

    // Clic fuera de las fotos o tecla Esc cierran la galería
    galeria.addEventListener("click", (e) => { if (e.target === galeria) cerrarGaleria(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarGaleria(); });

    /* ============================================================
       4. MÚSICA + LETRA SINCRONIZADA CON timeupdate
       ============================================================ */
    const audio    = document.getElementById("bg-music");
    const lyricEl  = document.getElementById("lyric");
    const progress = document.getElementById("progress");
    const curEl    = document.getElementById("timeCur");
    const totEl    = document.getElementById("timeTot");
    const polaroid = document.getElementById("polaroid");

    let lineaActual = -1;      // índice de la línea que suena
    let lineaDur    = 1;       // duración estimada de esa línea
    let lineEl      = null;    // <span> cuyo texto se va iluminando
    let rafId       = null;    // id del bucle de animación (~60 fps)

    // Formatea segundos -> "m:ss"
    function formato(seg) {
      if (!isFinite(seg)) seg = 0;
      const m = Math.floor(seg / 60);
      const s = Math.floor(seg % 60).toString().padStart(2, "0");
      return m + ":" + s;
    }

    // Índice de la línea vigente en el segundo t (-1 si aún no empieza)
    function indiceLinea(t) {
      for (let i = letra.length - 1; i >= 0; i--) {
        if (t >= letra[i].t) return i;
      }
      return -1;
    }

    // Duración "de canto" de una línea: el hueco hasta la siguiente, pero
    // acotado para no quedarse a medias durante los pasajes instrumentales.
    function duracionLinea(i) {
      const inicio = letra[i].t;
      const fin    = (i + 1 < letra.length) ? letra[i + 1].t : (audio.duration || inicio + 5);
      const gap    = fin - inicio;
      const estimado = Math.max(2.2, letra[i].texto.length * 0.135);
      return Math.max(1.2, Math.min(gap, estimado));
    }

    // Escribe el corazón + el texto iluminable y lo guarda en lineEl
    function pintarLetra(texto) {
      lyricEl.textContent = "";
      const ico = document.createElement("span");
      ico.className = "heart-ico";
      ico.textContent = "❤";
      lineEl = document.createElement("span");
      lineEl.className = "lyric-line";
      lineEl.textContent = texto;
      lyricEl.appendChild(ico);
      lyricEl.appendChild(lineEl);
      return lineEl;
    }

    // Barra, reloj, cambio de línea y progreso del karaoke
    function actualizar(t) {
      // Barra de progreso y reloj
      progress.style.width = (t / audio.duration * 100 || 0) + "%";
      curEl.textContent = formato(t);

      // Si cambió de línea, la pintamos y calculamos su duración
      const idx = indiceLinea(t);
      if (idx !== lineaActual) {
        lineaActual = idx;
        if (idx >= 0) {
          pintarLetra(letra[idx].texto);
          lineaDur = duracionLinea(idx);
          mostrarLetra();
        }
      }

      // Iluminación tipo karaoke: --p va de 0 (apagado) a 1 (brillante)
      if (lineaActual >= 0 && lineEl) {
        const p = Math.min(1, Math.max(0, (t - letra[lineaActual].t) / lineaDur));
        lineEl.style.setProperty("--p", p.toFixed(4));
      }
    }

    // Bucle fluido para que el brillo avance al ritmo real de la canción
    function bucle() {
      actualizar(audio.currentTime);
      rafId = audio.paused ? null : requestAnimationFrame(bucle);
    }

    audio.addEventListener("timeupdate", () => { if (!rafId) actualizar(audio.currentTime); });
    audio.addEventListener("seeked", () => actualizar(audio.currentTime));

    /* ---- Barra arrastrable: mover la canción a cualquier minuto ---- */
    const seekBar = document.getElementById("seekBar");
    let arrastrando = false;

    // Convierte la posición del puntero en un segundo de la canción
    function segundoDesdeEvento(e) {
      if (!audio.duration) return 0;
      const rect = seekBar.getBoundingClientRect();
      let x = (e.clientX - rect.left) / rect.width;
      x = Math.min(1, Math.max(0, x));
      return x * audio.duration;
    }

    // Salta a la posición señalada y refresca la letra al instante
    function buscarEn(e) {
      audio.currentTime = segundoDesdeEvento(e);
      actualizar(audio.currentTime);
    }

    seekBar.addEventListener("pointerdown", (e) => {
      arrastrando = true;
      if (seekBar.setPointerCapture) seekBar.setPointerCapture(e.pointerId);
      buscarEn(e);
      e.preventDefault();
    });

    seekBar.addEventListener("pointermove", (e) => {
      if (arrastrando) buscarEn(e);
    });

    ["pointerup", "pointercancel"].forEach((tipo) => {
      seekBar.addEventListener(tipo, () => { arrastrando = false; });
    });

    /* ---- Botón de pausa: detiene/reanuda canción + fotos ---- */
    const pauseBtn = document.getElementById("pause-btn");

    function actualizarBotonPausa() {
      const pausado = audio.paused;
      pauseBtn.textContent = pausado ? "▶ Reanudar" : "⏸ Pausar";
      pauseBtn.setAttribute("aria-label", pausado ? "Reanudar" : "Pausar");
    }

    audio.addEventListener("play", () => {
      if (!rafId) bucle();
      reanudarCarrusel();          // las fotos siguen a la canción
      actualizarBotonPausa();
    });

    audio.addEventListener("pause", () => {
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      pausarCarrusel();            // las fotos se detienen con la canción
      actualizarBotonPausa();
    });

    // Un solo botón que pausa o reanuda todo a la vez
    pauseBtn.addEventListener("click", () => {
      if (audio.paused) audio.play();
      else audio.pause();
    });

    // Duración total disponible una vez se cargan los metadatos
    audio.addEventListener("loadedmetadata", () => {
      totEl.textContent = formato(audio.duration);
    });

    // Al terminar la canción, deja un mensaje final totalmente iluminado
    audio.addEventListener("ended", () => {
      lineaActual = -1;
      const fin = pintarLetra("Gracias por ser mi persona favorita");
      fin.style.setProperty("--p", "1");
      mostrarLetra();
    });

    // Animación de entrada de cada línea
    function mostrarLetra() {
      lyricEl.classList.remove("active");
      // Reflow forzado para reiniciar la transición CSS
      void lyricEl.offsetWidth;
      lyricEl.classList.add("active");
    }

    /* ============================================================
       5. BOTÓN INICIAL: DESBLOQUEA EL AUDIO (autoplay policy)
       ============================================================ */
    document.getElementById("start-btn").addEventListener("click", () => {
      // Ocultar la pantalla inicial
      document.getElementById("overlay").classList.add("hidden");

      // Retirar la inclinación del marco (efecto sutil)
      polaroid.classList.remove("skew");

      // Arrancar las fotos DESDE LA PRIMERA, justo al empezar la canción
      iniciarCarrusel();

      // Reproducir la música: requiere gesto del usuario
      audio.play()
        .catch((err) => console.warn("No se pudo reproducir:", err));
    });
  </script>
</body>
</html>
